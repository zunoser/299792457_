name: Archive X snapshots

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: archive-x-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    name: Render and commit new posts
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Required only to commit generated PNG files.
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.21.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install dashboard dependencies
        run: uv sync --locked

      - name: Join the tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: tw.home.yutakobayashi.com

      - name: Render snapshots
        run: pnpm snapshot

      - name: Build dashboard
        run: uv run --locked python scripts/build_dashboard.py

      - name: Commit snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- snapshots dashboard/index.html
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "archive: refresh X snapshots"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"
